<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="presentation" focusable="false">
  <!-- Płaskie, dekoracyjne tło strony logowania. Barwy marki FEER: #1E6DFF, #1D1D1A, #EA8F00. -->
  <rect width="1600" height="900" fill="#EEF3FC"/>

  <!-- duże koła -->
  <circle cx="1380" cy="760" r="420" fill="#1E6DFF" opacity=".10"/>
  <circle cx="180" cy="120" r="300" fill="#EA8F00" opacity=".13"/>
  <circle cx="1480" cy="90" r="110" fill="#1D1D1A" opacity=".05"/>

  <!-- symbol dostępności (postać w okręgu) -->
  <g transform="translate(1090 400)" fill="none" stroke="#1E6DFF" stroke-linecap="round" stroke-linejoin="round" opacity=".17">
    <circle cx="0" cy="0" r="250" stroke-width="26"/>
    <circle cx="0" cy="-130" r="44" fill="#1E6DFF" stroke="none"/>
    <path d="M-135 -50 H135" stroke-width="40"/>
    <path d="M0 -50 V70" stroke-width="40"/>
    <path d="M0 70 L-70 190 M0 70 L70 190" stroke-width="40"/>
  </g>

  <!-- lupa „tajemniczego klienta” -->
  <g fill="none" stroke="#1D1D1A" stroke-linecap="round" opacity=".10">
    <circle cx="1330" cy="610" r="115" stroke-width="26"/>
    <path d="M1412 692 L1500 780" stroke-width="40"/>
  </g>

  <!-- znaczniki listy kontrolnej -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(110 590)" stroke="#EA8F00" opacity=".38">
      <rect x="0" y="0" width="84" height="84" rx="16" stroke-width="12"/>
      <path d="M22 44 L38 60 L64 28" stroke-width="13"/>
    </g>
    <g transform="translate(230 700)" stroke="#1E6DFF" opacity=".26">
      <rect x="0" y="0" width="64" height="64" rx="13" stroke-width="10"/>
      <path d="M16 33 L28 45 L48 21" stroke-width="10"/>
    </g>
    <g transform="translate(70 735)" stroke="#1D1D1A" opacity=".12">
      <rect x="0" y="0" width="52" height="52" rx="11" stroke-width="8"/>
      <path d="M13 27 L23 37 L39 17" stroke-width="8"/>
    </g>
  </g>

  <!-- linie „wiersze listy” -->
  <g stroke="#1D1D1A" stroke-linecap="round" opacity=".07" stroke-width="14">
    <path d="M330 610 H560"/><path d="M330 650 H500"/><path d="M350 722 H520"/>
  </g>

  <!-- kropki -->
  <g fill="#1E6DFF" opacity=".22">
    <circle cx="760" cy="90" r="9"/><circle cx="800" cy="130" r="6"/><circle cx="720" cy="140" r="5"/>
    <circle cx="640" cy="780" r="8"/><circle cx="690" cy="820" r="5"/>
  </g>
  <g fill="#EA8F00" opacity=".35">
    <circle cx="980" cy="840" r="8"/><circle cx="930" cy="800" r="5"/><circle cx="520" cy="60" r="7"/>
  </g>
</svg>
